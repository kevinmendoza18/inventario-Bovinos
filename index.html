<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Control de Animales</title>
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#2d6a4f" />
<style>
  body { font-family: Arial; margin: 30px; background: #f8f9fa; }
  h2 { background: #007bff; color: white; padding: 10px; border-radius: 5px; }
  table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
  th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
  th { background: #e9ecef; }
  tfoot td { font-weight: bold; background: #f1f3f5; }
  input[type="number"] { width: 50px; }
  button { padding: 4px 8px; margin-left: 5px; font-weight: bold; cursor: pointer; }
  .num-control {
    display: inline-flex;
    align-items: center;
  }
  .num-control button {
    width: 25px; 
    height: 25px; 
    padding: 0;
    font-weight: bold;
    margin-left: 2px;
    margin-right: 2px;
  }
  @media (max-width: 480px) {
    button { padding: 6px 10px; font-size: 18px; }
    input[type="number"] { width: 45px; }
  }
  h1 {
    font-size: 3em;
    font-family: 'Segoe UI', Arial, sans-serif;
    color: #2d6a4f;
    background: linear-gradient(90deg, #b7e4c7 0%, #52b788 100%);
    padding: 30px 10px;
    border-radius: 15px;
    text-align:center;
    box-shadow: 0 4px 12px rgba(80, 80, 80, 0.07);
    margin-bottom: 40px;
  }
</style>
</head>
<body>
<h1>INVENTARIO BOVINOS</h1>

<h2>Registro de Hembras
  <button id="agregarHembra" title="Agregar fila hembra">+</button>
  <button id="eliminarHembra" title="Eliminar última fila hembra">-</button>
  <button id="nuevaCategoriaHembra" title="Crear nueva categoría">Nueva Categoría</button>
</h2>
<table id="tablaHembras">
  <thead>
    <tr>
      <th>Descripción</th>
      <th>Compras y Nacimientos</th>
      <th>Ventas</th>
      <th>Total Existentes</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td>0 a 3 meses</td>
      <td class="num-control">
        <input type="number" class="compra" value="0" min="0" data-valor="0" data-previo="0" />
        <button class="btn-decrement">-</button>
        <button class="btn-increment">+</button>
      </td>
      <td class="num-control">
        <input type="number" class="ventas" value="0" min="0" />
        <button class="btn-decrement">-</button>
        <button class="btn-increment">+</button>
      </td>
      <td class="total">0</td>
    </tr>
    <!-- Repite para los otros tr igual, se puede automatizar -->
    <!-- Omisión para brevedad, agrega botones a cada input compra y ventas -->
  </tbody>
  <tfoot>
    <tr><td colspan="3">TOTAL HEMBRAS</td><td id="totalHembras">0</td></tr>
  </tfoot>
</table>

<!-- Repite tabla Machos con estructura similar -->

<script>
// Función para manejar botones + y - al lado de inputs
function setupNumControls() {
  document.querySelectorAll('.num-control').forEach(container => {
    const input = container.querySelector('input[type=number]');
    const btnIncrement = container.querySelector('.btn-increment');
    const btnDecrement = container.querySelector('.btn-decrement');

    btnIncrement.addEventListener('click', () => {
      let val = parseInt(input.value) || 0;
      val++;
      input.value = val;
      input.dispatchEvent(new Event('input')); // para que actualice event listeners
    });

    btnDecrement.addEventListener('click', () => {
      let val = parseInt(input.value) || 0;
      if(val > parseInt(input.min || '0')) {
        val--;
        input.value = val;
        input.dispatchEvent(new Event('input'));
      }
    });
  });
}

// Llama esta función después de cargar datos o agregar filas dinámicamente
function actualizarListenersCustom() {
  setupNumControls();
  // Puedes también llamar aquí la función que actualiza totales y demás
}

window.addEventListener('load', () => {
  // Asumiendo que ya tienes tu cargarDatos y demás funciones
  cargarDatos();
  actualizarListenersCustom();
});

// También llama actualizarListenersCustom() después de agregar filas para aplicar a nuevos inputs
</script>

</body>
</html>
